<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000; /* 极度压抑的纯黑 */
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        /* 核心标题：为什么你们要抛弃了我？ */
        h1 {
            font-size: 1.8rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #e0e0e0; /* 略微发灰的白色，比纯白更压抑 */
            animation: fadeInOut 4s infinite; /* 缓慢闪烁，像濒死的呼吸 */
        }

        /* 倒计时区域 */
        .countdown {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 3px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            /* 添加过渡效果，让变成 fakelife 时更平滑 */
            transition: all 1s ease; 
        }

        /* 输入框区域 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #444;
            color: #fff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            outline: none;
            text-align: center;
            letter-spacing: 5px;
            width: 80%;
            transition: border 0.5s;
        }

        input:focus {
            border-bottom: 2px solid #fff; /* 输入时底部白线亮起 */
        }

        button {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 8px 30px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        /* 第III阶段提示 */
        .phase-3 {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #555;
            letter-spacing: 1px;
        }

        /* 提示信息 */
        #message {
            margin-top: 20px;
            font-size: 1rem;
            height: 20px;
            color: #ff003c;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>为什么你们要抛弃了我？</h1>
        
        <!-- 倒计时显示 -->
        <div class="countdown" id="countdown">CALCULATING TIME...</div>

        <div class="input-group">
            <input type="text" id="password" placeholder="PASSWORD" autocomplete="off">
            <button onclick="checkPassword()">WHYYYYYYY？！</button>
        </div>
        
        <div id="message"></div>

        <!-- 你要求之后要删去的内容 -->
        <div class="phase-3">11月25日解锁第III阶段</div>
    </div>

    <script>
        // 1. 密码验证逻辑
        function checkPassword() {
            const input = document.getElementById('password').value;
            const msg = document.getElementById('message');
            
            if (input === 'fakelife') {
                msg.style.color = '#fff';
                msg.innerText = "ACCESS GRANTED.未完待续";
                // 这里可以设置通关后的跳转
            } else {
                msg.style.color = '#ff003c';
                msg.innerText = "ACCESS DENIED.";
                // 让输入框抖动一下
                const inputElement = document.getElementById('password');
                inputElement.style.transform = "translateX(5px)";
                setTimeout(() => inputElement.style.transform = "translateX(-5px)", 50);
                setTimeout(() => inputElement.style.transform = "translateX(0)", 100);
            }
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        // 2. 倒计时逻辑（过期后永久锁死）
        function updateCountdown() {
            const now = new Date();
            // 设定目标日期：2026年 11月4日 00:00:00
            const targetDate = new Date(2026, 10, 25); 
            
            const diff = targetDate - now;
            const cdElement = document.getElementById('countdown');

            // 如果现在的时间已经过了目标日期（diff <= 0）
            if (diff <= 0) {
                cdElement.innerText = "fa : ke : li：fe";
                cdElement.style.color = "#fff";
                cdElement.style.textShadow = "0 0 15px #fff"; // 纯白发光
                cdElement.style.fontSize = "1.5rem";
                cdElement.style.letterSpacing = "8px";
                return; // 直接结束，永远停在这里
            }

            // 如果还没到，但只剩最后一天（24小时内）
            if (diff < 24 * 60 * 60 * 1000) {
                cdElement.innerText = "fa : ke : li：fe";
                cdElement.style.color = "#fff";
                cdElement.style.textShadow = "0 0 15px #fff";
                cdElement.style.fontSize = "1.5rem";
                cdElement.style.letterSpacing = "8px";
            } else {
                // 正常倒计时
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);
                
                // 格式化输出：例如 24 D : 05 H : 30 M : 12 S
                cdElement.innerText = 
                    `${days.toString().padStart(2, '0')} D : ${hours.toString().padStart(2, '0')} H : ${minutes.toString().padStart(2, '0')} M : ${seconds.toString().padStart(2, '0')} S`;
            }
        }

        // 每秒更新一次倒计时
        setInterval(updateCountdown, 1000);
        updateCountdown(); // 页面加载时立即执行一次
    </script>
</body>
</html>
